name: Windows NSIS (Shift + right-click)

on:
  push:
    branches: [build/shift-right-click-nsis]
    paths-ignore:
      - '.github/workflows/win-nsis-shift-right-click.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: x64
      - name: Install build tools
        run: |
          npm config set legacy-peer-deps true
          npm install -g node-gyp yarn
      - name: Install dependencies
        run: |
          npm un node-pty serialport
          npm i --include=dev
          npm i -S -E node-pty@1.1.0-beta14
          npm i -S -E serialport@13.0.0
      - name: Prepare application files
        run: npm run b
      - name: Prepare electron-builder config
        run: npm run pb
      - name: Build Windows x64 NSIS installer
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node src/build/bin/build-win-nsis.js --no-publish
      - uses: actions/upload-artifact@v4
        with:
          name: electerm-windows-shift-right-click-x64
          path: dist/*-installer.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: electerm-windows-shift-right-click-x64
          path: release-assets
      - name: Publish installer to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*-installer.exe)
          [[ ${#files[@]} -eq 1 && -s "${files[0]}" ]]
          pattern="^electerm-([0-9]+[.][0-9]+[.][0-9]+)-win-x64-installer[.]exe$"
          [[ ${files[0]##*/} =~ $pattern ]]
          tag="v${BASH_REMATCH[1]}-kokawu.$GITHUB_RUN_NUMBER"
          gh release create "$tag" "${files[0]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$tag" --notes 'Windows x64 NSIS installer with Shift + right-click paste. OSC 52 uses the upstream implementation.'
